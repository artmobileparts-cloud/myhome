# Сборка Android-приложения «Мой Дом» из прототипа.
#
# Локально собрать APK нельзя без Android SDK, поэтому сборка живёт здесь:
# на бегунке GitHub SDK уже стоит. Готовый файл забирается со страницы запуска,
# раздел Artifacts.
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      release:
        description: 'Собрать релизный APK (нужны секреты подписи)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Установить зависимости
        run: npm ci

      # Прототип с версии 24.08-530 сам превращается в приложение: режим
      # html.real гасит пульт, соседние телефоны, админку и нарисованный
      # корпус трубки. Сборка добавляет только то, чего ему не хватает внутри
      # обёртки, — см. tools/build-app.mjs.
      - name: Собрать приложение из прототипа
        run: node tools/build-app.mjs

      # Ресурсы Android падают на мелочах, которых не видно глазом.
      # Секунда здесь дешевле полного круга сборки.
      - name: Проверить XML-ресурсы
        run: python3 tools/check-xml.py

      # Шрифты должны лежать ВНУТРИ приложения, а не тянуться из сети:
      # приложение открывают в подъезде, где связи почти нет, а подменный
      # шрифт другой ширины ломает всю раскладку (правило из прототипа).
      - name: Вшить шрифты в приложение
        run: node tools/fetch-fonts.mjs

      - name: Перенести веб-часть в Android-проект
        run: npx cap sync android

      - name: Собрать отладочный APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Собрать релизный APK
        if: inputs.release
        working-directory: android
        env:
          MYHOME_KEYSTORE_PASSWORD: ${{ secrets.MYHOME_KEYSTORE_PASSWORD }}
          MYHOME_KEY_ALIAS: ${{ secrets.MYHOME_KEY_ALIAS }}
          MYHOME_KEY_PASSWORD: ${{ secrets.MYHOME_KEY_PASSWORD }}
          MYHOME_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "${{ secrets.MYHOME_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MYHOME_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/myhome.jks"
            export MYHOME_KEYSTORE="$RUNNER_TEMP/myhome.jks"
          else
            echo "::warning::Секрета MYHOME_KEYSTORE_BASE64 нет — APK выйдет неподписанным."
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Выложить APK
        uses: actions/upload-artifact@v7
        with:
          name: myhome-apk
          retention-days: 30
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
