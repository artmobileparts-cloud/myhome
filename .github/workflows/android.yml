# Сборка Android-приложения «Мой Дом» из прототипа.
#
# Локально собрать APK нельзя без Android SDK, поэтому сборка живёт здесь:
# на бегунке GitHub SDK уже стоит. Готовый файл забирается со страницы запуска,
# раздел Artifacts.
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      release:
        description: 'Собрать релизный APK (нужны секреты подписи)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Установить зависимости
        run: npm ci

      # Шрифты должны лежать ВНУТРИ приложения, а не тянуться из сети:
      # приложение открывают в подъезде, где связи почти нет, а подменный
      # шрифт другой ширины ломает всю раскладку (правило из прототипа).
      # Ресурсы Android падают на мелочах, которых не видно глазом.
      # Секунда здесь дешевле полного круга сборки.
      # Боевое приложение не лежит в репозитории готовым файлом: оно вынимается
      # из прототипа скриптом по меткам самого прототипа. Так правка прототипа
      # доезжает до APK одной командой, а копия не устаревает молча.
      # Отладочный APK собирается для показа: сервера нет, мир пустой, и без
      # двери предпросмотра войти в приложение буквально не за кого. Дверь даёт
      # мастер-код, собирает демо-мир и сажает внутрь за роль; обычный вход по
      # номеру из неё тоже доступен. Код меняется переменной репозитория
      # MYHOME_PREVIEW_CODE (Settings → Secrets and variables → Variables).
      - name: Вынуть боевое приложение из прототипа
        run: node tools/extract-prod.mjs --preview --code=${{ vars.MYHOME_PREVIEW_CODE || '2026' }}

      - name: Проверить XML-ресурсы
        run: python3 tools/check-xml.py

      - name: Вшить шрифты в приложение
        run: node tools/fetch-fonts.mjs

      - name: Перенести веб-часть в Android-проект
        run: npx cap sync android

      - name: Собрать отладочный APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Релиз собирается ЗАНОВО и начисто: мастер-код — дверь без замка, и в
      # приложении, которое стоит у людей на телефонах, ему не место. Выемка
      # это стережёт сама и отказывается собирать --preview при MYHOME_RELEASE=1.
      - name: Пересобрать веб-часть начисто для релиза
        if: inputs.release
        env:
          MYHOME_RELEASE: '1'
        run: |
          node tools/extract-prod.mjs
          node tools/fetch-fonts.mjs
          npx cap sync android

      - name: Собрать релизный APK
        if: inputs.release
        working-directory: android
        env:
          MYHOME_KEYSTORE_PASSWORD: ${{ secrets.MYHOME_KEYSTORE_PASSWORD }}
          MYHOME_KEY_ALIAS: ${{ secrets.MYHOME_KEY_ALIAS }}
          MYHOME_KEY_PASSWORD: ${{ secrets.MYHOME_KEY_PASSWORD }}
          MYHOME_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "${{ secrets.MYHOME_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MYHOME_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/myhome.jks"
            export MYHOME_KEYSTORE="$RUNNER_TEMP/myhome.jks"
          else
            echo "::warning::Секрета MYHOME_KEYSTORE_BASE64 нет — APK выйдет неподписанным."
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: myhome-apk
          retention-days: 30
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
