<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="360" fill="#FBF8F3"/><text x="24" y="34" font-size="19" font-weight="700" fill="#2A2622">Один телефон — роли-шляпы</text><defs><marker id="xar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#8A8378"/></marker></defs><rect x="280" y="64" width="140" height="64" rx="10" fill="#FFF" stroke="#2A2622" stroke-width="1.5"/><text x="350" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ТЕЛЕФОН</text><text x="350" y="108" text-anchor="middle" font-size="12" fill="#5A544C">= аккаунт, один</text><rect x="40" y="210" width="140" height="74" rx="10" fill="#EAF3EC" stroke="#4C8C6A" stroke-width="1.5"/><text x="110" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ЖИЛЕЦ</text><text x="110" y="254" text-anchor="middle" font-size="12" fill="#5A544C">квартира в доме,</text><text x="110" y="271" text-anchor="middle" font-size="12" fill="#5A544C">одобряет ваад</text><rect x="212" y="210" width="140" height="74" rx="10" fill="#EDF1F6" stroke="#5B7C99" stroke-width="1.5"/><text x="282" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ВААД</text><text x="282" y="254" text-anchor="middle" font-size="12" fill="#5A544C">назначает только</text><text x="282" y="271" text-anchor="middle" font-size="12" fill="#5A544C">действующий ваад</text><rect x="384" y="210" width="140" height="74" rx="10" fill="#FDF3E4" stroke="#C9A24A" stroke-width="1.5"/><text x="454" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">СПЕЦИАЛИСТ</text><text x="454" y="254" text-anchor="middle" font-size="12" fill="#5A544C">кнопка «стать</text><text x="454" y="271" text-anchor="middle" font-size="12" fill="#5A544C">специалистом»</text><rect x="556" y="210" width="116" height="74" rx="10" fill="#F3EDF6" stroke="#8A6FA8" stroke-width="1.5"/><text x="614" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ПАРТНЁР</text><text x="614" y="254" text-anchor="middle" font-size="12" fill="#5A544C">отдельный</text><text x="614" y="271" text-anchor="middle" font-size="12" fill="#5A544C">кошелёк</text><line x1="350" y1="130" x2="110" y2="206" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><line x1="350" y1="130" x2="282" y2="206" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><line x1="350" y1="130" x2="454" y2="206" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><line x1="350" y1="130" x2="614" y2="206" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><text x="350" y="330" text-anchor="middle" font-size="13" fill="#5A544C">Роли — шляпы поверх одного номера. Полоска режимов появляется сама, если шляп две и больше.</text></svg>