<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 286" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="286" fill="#FBF8F3"/><text x="24" y="34" font-size="19" font-weight="700" fill="#2A2622">Путь жильца: от входа до дома</text><defs><marker id="xar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#8A8378"/></marker></defs><rect x="28" y="110" width="120" height="72" rx="10" fill="#EDF1F6" stroke="#5B7C99" stroke-width="1.5"/><text x="88" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ВХОД</text><text x="88" y="154" text-anchor="middle" font-size="12" fill="#5A544C">телефон + SMS</text><rect x="162" y="110" width="120" height="72" rx="10" fill="#FFF" stroke="#8A8378" stroke-width="1.5"/><text x="222" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">АДРЕС</text><text x="222" y="154" text-anchor="middle" font-size="12" fill="#5A544C">дом по адресу-ключу</text><line x1="148" y1="146" x2="160" y2="146" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><rect x="296" y="110" width="120" height="72" rx="10" fill="#FFF" stroke="#8A8378" stroke-width="1.5"/><text x="356" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">КВАРТИРА</text><text x="356" y="154" text-anchor="middle" font-size="12" fill="#5A544C">до двух взрослых</text><line x1="282" y1="146" x2="294" y2="146" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><rect x="430" y="110" width="120" height="72" rx="10" fill="#FDF3E4" stroke="#C9A24A" stroke-width="1.5"/><text x="490" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ОДОБРЕНИЕ</text><text x="490" y="154" text-anchor="middle" font-size="12" fill="#5A544C">подтверждает ваад</text><line x1="416" y1="146" x2="428" y2="146" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><rect x="564" y="110" width="120" height="72" rx="10" fill="#EAF3EC" stroke="#4C8C6A" stroke-width="1.5"/><text x="624" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ЖИЛЕЦ</text><text x="624" y="154" text-anchor="middle" font-size="12" fill="#5A544C">полный доступ</text><line x1="550" y1="146" x2="562" y2="146" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><text x="350" y="236" text-anchor="middle" font-size="12" fill="#5A544C">Третий взрослый в квартире — предупреждение и замена по решению ваада; система сама никого не выселяет.</text><text x="350" y="258" text-anchor="middle" font-size="12" fill="#5A544C">SMS подтверждает номер один раз на устройстве; выход стирает доверие устройства.</text></svg>