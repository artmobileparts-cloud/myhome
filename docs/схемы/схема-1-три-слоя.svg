<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="392" fill="#FBF8F3"/><text x="24" y="34" font-size="19" font-weight="700" fill="#2A2622">Три слоя одного файла прототипа</text><defs><marker id="xar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#8A8378"/></marker></defs><rect x="40" y="70" width="620" height="84" rx="10" fill="#EAF3EC" stroke="#4C8C6A" stroke-width="1.5"/><text x="350" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">БОЕВОЕ ПРИЛОЖЕНИЕ — без меток</text><text x="350" y="114" text-anchor="middle" font-size="12" fill="#5A544C">Экраны, логика, правила, тексты — переносится в продукт как замысел</text><rect x="40" y="178" width="620" height="74" rx="10" fill="#EDF1F6" stroke="#5B7C99" stroke-width="1.5"/><text x="350" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">АДМИН-ПАНЕЛЬ — data-scope="admin"</text><text x="350" y="222" text-anchor="middle" font-size="12" fill="#5A544C">Пульт владельца платформы: цены, комиссии, промо — тоже боевая часть</text><rect x="40" y="276" width="620" height="84" rx="10" fill="#FBEFEA" stroke="#C96F4A" stroke-width="1.5"/><text x="350" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ДЕМО-ЛЕСА — data-scope="demo" и метка «ДЕМО» в коде</text><text x="350" y="320" text-anchor="middle" font-size="12" fill="#5A544C">Пульт, сцена телефонов, прогон, ревизор, кнопки выгрузки —</text><text x="350" y="337" text-anchor="middle" font-size="12" fill="#5A544C">в продукт НЕ переносится, заменяется настоящей техникой</text></svg>