<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 384" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="384" fill="#FBF8F3"/><text x="24" y="34" font-size="19" font-weight="700" fill="#2A2622">Куда текут деньги (бонус — доля НАШЕГО дохода)</text><defs><marker id="xar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#8A8378"/></marker></defs><rect x="40" y="70" width="190" height="90" rx="10" fill="#EAF3EC" stroke="#4C8C6A" stroke-width="1.5"/><text x="135" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ДОМ</text><text x="135" y="114" text-anchor="middle" font-size="12" fill="#5A544C">₪129/мес до 8 эт.</text><text x="135" y="131" text-anchor="middle" font-size="12" fill="#5A544C">₪179/мес от 8 эт.</text><text x="135" y="148" text-anchor="middle" font-size="12" fill="#5A544C">подписка дома</text><rect x="255" y="70" width="190" height="90" rx="10" fill="#FDF3E4" stroke="#C9A24A" stroke-width="1.5"/><text x="350" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">СПЕЦИАЛИСТ</text><text x="350" y="114" text-anchor="middle" font-size="12" fill="#5A544C">₪129/мес</text><text x="350" y="131" text-anchor="middle" font-size="12" fill="#5A544C">после 3 беспл. месяцев</text><text x="350" y="148" text-anchor="middle" font-size="12" fill="#5A544C">+продвижение ₪49/мес</text><rect x="470" y="70" width="190" height="90" rx="10" fill="#EDF1F6" stroke="#5B7C99" stroke-width="1.5"/><text x="565" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ПРОДВИЖЕНИЕ</text><text x="565" y="114" text-anchor="middle" font-size="12" fill="#5A544C">вещь · объект · специалист</text><text x="565" y="131" text-anchor="middle" font-size="12" fill="#5A544C">разовая плата</text><text x="565" y="148" text-anchor="middle" font-size="12" fill="#5A544C">дохода платформы</text><rect x="150" y="250" width="200" height="70" rx="10" fill="#EAF3EC" stroke="#4C8C6A" stroke-width="1.5"/><text x="250" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">БОНУС ЖИЛЬЦУ</text><text x="250" y="294" text-anchor="middle" font-size="12" fill="#5A544C">за продвижение СВОЕГО</text><text x="250" y="311" text-anchor="middle" font-size="12" fill="#5A544C">часть нашего дохода</text><text x="250" y="328" text-anchor="middle" font-size="12" fill="#5A544C">копится в шкале</text><rect x="400" y="250" width="200" height="70" rx="10" fill="#F3EDF6" stroke="#8A6FA8" stroke-width="1.5"/><text x="500" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2622">ПЛАТФОРМЕ</text><text x="500" y="294" text-anchor="middle" font-size="12" fill="#5A544C">остальной доход</text><text x="500" y="311" text-anchor="middle" font-size="12" fill="#5A544C">подписки и продвижение</text><line x1="520" y1="164" x2="250" y2="246" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><line x1="560" y1="164" x2="500" y2="246" stroke="#8A8378" stroke-width="1.6" marker-end="url(#xar)"/><text x="350" y="360" text-anchor="middle" font-size="12" fill="#8A8378">Цифры живые — из админки в момент сборки. На 100% шкалы платформа платит вааду взнос этого жильца.</text></svg>