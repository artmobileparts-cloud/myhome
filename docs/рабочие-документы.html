<style>

  .wrap{display:flex;min-height:100vh}

  /* ── оглавление ── */

  .foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);

    .nav .gr{display:inline-block;padding:10px 12px 4px}
    .page{padding:22px 18px 70px}
  }

  .rlk .rbox.red{border-color:rgba(226,88,92,.45)} .rlk .rbox.red .t{color:#E2585C}

  .rlk .rnum{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:#F2F2F5}

  .rlk .rcap{font-size:11.5px;color:#8A8A98;margin-top:3px}

MY HOME - РАБОЧИЕ ДОКУМЕНТЫ. Пара к файлу «прототип_MY_HOME.html».

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ⚠⚠ ФАЙЛ ЖИВЁТ ВМЕСТЕ С ПРОТОТИПОМ — ПРАВИЛО ЭДУАРДА 17.08.2026 ⚠⚠
   «Если мы меняем что-то, что указано в этом файле, или добавляем —
    в этом файле надо тоже менять или добавлять.»
   Изменилась цена, срок, порог, правило, экран, письмо — правится И ЗДЕСЬ.
   Иначе файл за неделю разойдётся с приложением и станет вреден:
   программист прочтёт неправду.
   ═══════════════════════════════════════════════════════════════════════ */

const РАЗДЕЛЫ = [];
/* часть — одна из шести больших; группа — подраздел внутри части */
function Р(часть, группа, ключ, имя, html){
  РАЗДЕЛЫ.push({ часть, группа, ключ, имя, html });
}

/* помощники */
const карта = (t,m) => `<div class="card"><div class="t">${t}</div><div class="m">${m}</div></div>`;
const шаг = (b,t) => `<div class="s"><b>${b}</b>${t}</div>`;
const поток = (...s) => `<div class="flow">${s.join('')}</div>`;
const кв = (k,v) => `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`;

/* ═════════ 1. ЧТО ЭТО ═════════ */
Р('Барахолка','Основа','bar_что','Что это и зачем', `
<h1>Барахолка</h1>
<p class="sub">Соседи отдают и продают вещи. Модуль «Из рук в руки».</p>

<p class="lead">Барахолка — это доска объявлений о вещах внутри приложения дома.
Диван, коляска, велосипед, инструмент. Продают и отдают даром.</p>

<h2>Чем она отличается от Яд2</h2>
<p>Тем, что человек уже здесь. Он зашёл проголосовать за ремонт крыши,
и заодно увидел, что сосед отдаёт стол. Барахолка не борется за внимание —
она живёт рядом с делом, ради которого приложение и открыли.</p>

<div class="grid g3">
  ${карта('Место','Вещь надо забрать. Далеко за диваном не поедут — но за хорошую цену поедут.')}
  ${карта('Цена','Дёшево или даром перевешивает расстояние. Дорогое издалека утонет само.')}
  ${карта('Категория','Ищут по ней, но случайная находка — суть барахолки.')}
</div>

<div class="note acc"><b>Три опоры</b>
Всё устройство барахолки построено на этих трёх вещах: где лежит, сколько стоит,
что это. Из них вырастают и лента, и продвижение, и совет.</div>
`);

/* ═════════ 2. КЛИЕНТ ═════════ */
Р('Барахолка','Стороны','bar_клиент','Что может тот, кто ищет', `
<h1>Клиент: тот, кто ищет вещь</h1>
<p class="sub">Любой жилец приложения, в том числе без дома.</p>

<h2>Что он может</h2>
<table>
  <tr><th>Действие</th><th>Как</th><th>Ограничения</th></tr>
  <tr><td>Смотреть ленту</td><td>Открыл раздел — видит вещи, отсортированные под себя</td><td>нет</td></tr>
  <tr><td>Искать словом</td><td>Поиск по заголовку <b>и по описанию</b></td><td>нет</td></tr>
  <tr><td>Фильтровать</td><td>Категория, «отдам даром», свой город / округ / вся страна</td><td>нет</td></tr>
  <tr><td>Открыть вещь</td><td>Фото, цена, где забрать, сколько дней в ленте</td><td>нет</td></tr>
  <tr><td>Написать продавцу</td><td>Чат внутри приложения</td><td>только зарегистрированный</td></tr>
  <tr><td>Пожаловаться</td><td>Кнопка на карточке</td><td>после <b>3 жалоб</b> вещь уходит на проверку</td></tr>
</table>

<h2>Чего он НЕ может</h2>
<ul>
  <li>Увидеть телефон продавца — только чат. Номер не показываем никому.</li>
  <li>Оплатить вещь через приложение. <b>Мы не сторона сделки</b> — деньги идут мимо нас.</li>
  <li>Оставить отзыв продавцу. Рейтинга у продавцов нет — почему, объяснено ниже.</li>
</ul>

<div class="note warn"><b>Мы не сторона сделки</b>
Договорились в чате, встретились, отдали вещь и деньги — это между ними.
Мы не берём комиссии, не держим денег, не гарантируем качества вещи.
Это записано в правилах раздела, которые человек принимает при первой подаче.</div>
`);

/* ═════════ 3. ПРОДАВЕЦ ═════════ */
Р('Барахолка','Стороны','bar_продавец','Что может тот, кто продаёт', `
<h1>Продавец: тот, кто отдаёт вещь</h1>
<p class="sub">Тот же жилец. Отдельной регистрации нет.</p>

<h2>Как он подаёт вещь</h2>
${поток(
  шаг('Шаг 1','Заголовок, описание, категория'),
  шаг('Шаг 2','Цена — или «отдам даром»'),
  шаг('Шаг 3','Фото: до 5 штук'),
  шаг('Шаг 4','Город и охват: свой двор / город / округ / страна'),
  шаг('Шаг 5','Принял правила раздела — опубликовано')
)}

<h2>Что он может дальше</h2>
<table>
  <tr><th>Действие</th><th>Подробности</th></tr>
  <tr><td>Видеть числа</td><td><b>Показы, открытия, обращения</b> по каждой вещи</td></tr>
  <tr><td>Править</td><td>Цену, описание, фото — в любой момент</td></tr>
  <tr><td>Снять с ленты</td><td>Продал или передумал</td></tr>
  <tr><td>Отметить «отдано»</td><td>Вещь уходит из ленты, история остаётся</td></tr>
  <tr><td>Продлить</td><td>Срок жизни <b>14 дней</b>, дальше объявление гаснет</td></tr>
  <tr><td>Купить продвижение</td><td>Три срока — описано в отдельном разделе</td></tr>
</table>

<h2>Пределы</h2>
${кв('Объявлений разом','<b>5</b> — правится в админке')}
${кв('Фотографий','<b>5</b> на объявление')}
${кв('Срок жизни','<b>14 дней</b>, потом гаснет; продлить можно')}

не принимает, значит обещать то, чего не существует. Наличные и чек председатель
включает или выключает сам: многие их не берут.</div>

<h2>Фото подтверждения</h2>
<p>Нужно <b>только для банковского перевода</b>: он идёт день-два, и без бумаги
председатель не разберёт, чей это платёж. Для Bit и Paybox снимок не нужен —
платёж мгновенный, деньги падают сразу, и председатель видит их у себя.</p>

<h2>Постоянное поручение</h2>
<p>Человек отмечает: «плачу поручением такого-то числа». Деньги приходят сами,
а долг висит, пока председатель не сверится со счётом дома. Поэтому:</p>
<ul>
  <li>Жильцу подпись: «платить второй раз не нужно, подтверждение занимает время».</li>
  <li>Председателю через три дня после срока — строка «проверьте поступление».</li>
  <li>Число списания жилец может поменять сам — в банке он меняет его свободно.</li>
</ul>

<h2>Что делает председатель</h2>
<ul>
  <li>Ставит взнос по умолчанию и меняет сумму отдельной квартире.</li>
  <li>Подтверждает платежи: «деньги пришли» — выписываются квитанции на каждый закрытый месяц.</li>
  <li>Прощает долг или даёт скидку — с причиной и подписью.</li>
  <li>Ведёт квартиры без приложения сам: заводит, хранит телефон, отмечает оплату.</li>
  <li>Вписывает реквизиты: банк, счёт, на чьё имя, Bit, Paybox.</li>
</ul>

<div class="note red"><b>Прощённое — не деньги</b>
Списанный долг не считается доходом дома: иначе отчёт скажет, что собрали
больше, чем собрали, и касса разойдётся с банком. И списать больше долга
нельзя — счёт не уходит в минус от прощения.</div>

`);

почта и роль. В показном мире их пятеро — владелец, двое из поддержки, внешний
бухгалтер и наблюдатель (инвестор, юрист или новичок в первый день).</p>

<div class="note acc"><b>Ревизор входит каждым из них</b>
И смотрит, что тот вправду открыл. Прежние правила читали КАРТУ ПРАВ — а карта
может быть верной, пока экран нарисован по старой памяти, и бухгалтер увидит
рубильники платформы. Проверка делом называет человека по имени.</div>

<h2>Мост: админка и приложение</h2>
<p>Рубильники в админке гасят модули в приложении: доску, зал, барахолку,
недвижимость, счётчики. Выключил — раздел исчезает у всех домов сразу.</p>

<div class="note red"><b>Дверь спрятана — комната открыта</b>
Так это работало раньше, и заметить было почти нельзя. Рубильник ПРЯТАЛ пункт
меню — и все думали, что модуль выключен. А сам экран открывался как ни в чём
не бывало: с плитки на главной, из письма, по любой сохранённой дороге.
Теперь заслон стоит в единой двери перехода: любой новый модуль защищён сразу.</div>

<p>И обратная беда была не легче: <b>пять модулей нельзя было выключить вовсе</b> —
билеты, коммуналка, ремонт, такси, связь. Дом просит убрать раздел, а мы не можем.</p>
`);

<h2>Ревизор: три полки</h2>
<p>Находки делятся по слоям, потому что чинят их разные руки:</p>

Мост гасит рубильник и смотрит, послушалось ли приложение. Так нашлась беда,

<h2>Реестр возможностей</h2>
<p>Каждая возможность объявляет о себе и говорит, чем её проверять. Три
обязательных поля:</p>
<ul>
  <li><b>Кто стережёт</b> — правила ревизора. Нет ни одного → красная находка.</li>
  <li><b>Есть ли данные</b> — случай должен жить в мире. Нет → красная.</li>
  <li><b>Проживает ли прогон</b> — дверь должна открыться за 30 дней. Нет → жёлтая.</li>
</ul>

<div class="note red"><b>Забывчивость становится находкой</b>

<h2>Что едет в бой</h2>
<p>Из 151 правила <b>146 боевых</b> — они про устройство: деньги сходятся, письма

(есть ли данные в демо, сработала ли сцена). В бою таких вещей нет: не переносить.</p>

<div class="note"><b>Чего не ловит ни один способ</b>

и ни одна не спросит «а что если человек умер, а квартира сдана».
Это ловится только разговором.</div>
`);

<h1>Почему это честно</h1>

<div class="note red"><b>Нашли прямую несправедливость — и починили</b>
Дом <b>без числа квартир</b> получал 76 и зелёный, а с числом — 71 и жёлтый.
Причина злая и простая: все проценты считаются от квартир — сбор, явка, охват.
Нет квартир — эти показатели выпадают из расчёта. А выпадали как раз слабые.
<b>Получалось, что не заполнять данные выгодно.</b></div>

<h2>Правило</h2>
<p>Нет числа квартир — <b>числа не показываем вовсе</b> и честно говорим,
чего не хватает. Сравнение с соседями тоже не включаем: сравнивать дом
неизвестного размера не с кем по определению.</p>

Малому дому легче навести порядок: восемь человек уговорить проще, чем

   ⚠ ПАПКА «ДЛЯ ИНЖЕНЕРА» ПЕРЕЕХАЛА СЮДА ЦЕЛИКОМ (19.08.2026, слово Эдуарда:

const ФАЙЛ_ИНЖ = {};

function esc0(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let РИ = 0, РИГРА = false, РГОЛОС = null, РСКОР = 1, РТАЙМ = null;
function роликГолоса(){
  const все = speechSynthesis.getVoices();
  const ру = все.filter(v => /^ru/i.test(v.lang));
  return ру.length ? ру : все;
}
function роликСтоп(){ РИГРА = false; speechSynthesis.cancel(); if(РТАЙМ) clearTimeout(РТАЙМ); роликКнопки(); }
function роликСкажи(сц, дальше){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(сц.говор.replace(/\s+/g,' ').trim());
  u.lang = 'ru-RU'; u.rate = РСКОР;
  if(РГОЛОС) u.voice = РГОЛОС;
  u.onend = () => { if(РИГРА && дальше) { РТАЙМ = setTimeout(дальше, 700); } };
  speechSynthesis.speak(u);
}
function роликПокажи(){
  const сц = РОЛИК_СЦЕНЫ[РИ];
  const s = document.getElementById('rstage'); if(!s) return;
  s.innerHTML = `<div class="rinner">${сц.html}</div>`;
  const т = document.getElementById('rtitr');
  if(т) т.textContent = сц.говор.replace(/\s+/g,' ').trim();
  const п = document.getElementById('rprog');
  if(п) п.style.width = ((РИ+1)/РОЛИК_СЦЕНЫ.length*100) + '%';
  const н = document.getElementById('rnum');
  if(н) н.textContent = (РИ+1) + ' / ' + РОЛИК_СЦЕНЫ.length + ' · ' + сц.глава;
  роликКнопки();
}
function роликКнопки(){
  const b = document.getElementById('rplay');
  if(b) b.textContent = РИГРА ? '⏸ пауза' : '▶ пуск';
}
function роликШаг(сц){
  роликПокажи();
  if(РИГРА) роликСкажи(РОЛИК_СЦЕНЫ[РИ], () => {
    if(РИ < РОЛИК_СЦЕНЫ.length - 1){ РИ++; роликШаг(); }
    else { РИГРА = false; роликКнопки(); }
  });
}
function роликПуск(){
  if(РИГРА){ роликСтоп(); return; }
  РИГРА = true;
  const в = роликГолоса();
  const sel = document.getElementById('rvoice');
  if(sel && sel.value !== '') РГОЛОС = в[+sel.value] || null;
  роликШаг();
}
function роликК(н){
  РИ = Math.max(0, Math.min(РОЛИК_СЦЕНЫ.length - 1, н));
  speechSynthesis.cancel(); if(РТАЙМ) clearTimeout(РТАЙМ);
  if(РИГРА) роликШаг(); else роликПокажи();
}

function роликСтраница(){
  РИ = 0; роликСтоп();
  document.getElementById('page').innerHTML =
    `<h1>Ролик</h1>
     <p class="sub">Один большой показ: всё приложение от начала до конца, ${РОЛИК_СЦЕНЫ.length} сцен с озвучкой.</p>
     <div class="dlbar">
       <button onclick="роликФайл()">Скачать ролик отдельным файлом</button>
     </div>
     <div class="note acc"><b>Как пользоваться</b>
     «Пуск» — ролик идёт сам и читает голосом. Стрелками ◀ ▶ — вручную.
     Озвучка встроенным голосом браузера; <b>лучше всего звучит в Edge</b> —
     там живые русские голоса Microsoft.</div>
     <div class="rlk">
       <div class="rstage" id="rstage"></div>
       <div class="rbar">
         <div class="rline"><i id="rprog"></i></div>
         <div class="rtitr" id="rtitr"></div>
         <div class="rrow">
           <button class="rbtn" id="rplay" onclick="роликПуск()">▶ пуск</button>
           <button class="rbtn gh" onclick="роликК(РИ-1)">◀</button>
           <button class="rbtn gh" onclick="роликК(РИ+1)">▶</button>
           <span class="rnumв" id="rnum"></span>

           <select onchange="РСКОР=+this.value">
             <option value="0.9">медленнее</option>

             <option value="1.15">быстрее</option>

       </div>
     </div>`;
  const s=document.getElementById('rvoice');
  const залей=()=>{ const в=роликГолоса();
    s.innerHTML='<option value="">голос сам</option>'+в.map((v,i)=>`<option value="${i}">${v.name}</option>`).join(''); };
  speechSynthesis.onvoiceschanged=залей; залей();
  роликПокажи();
  document.querySelectorAll('.nav a').forEach(a => a.classList.remove('on'));

function пусто(){
  document.getElementById('page').innerHTML =
    `<h1>${ЧАСТЬ}</h1><p class="sub">Эта часть ещё пишется.</p>
     <div class="note acc"><b>Скоро здесь будет</b>
     Что может партнёр и что может клиент · все возможности · алгоритм ленты ·
     рейтинг · честный совет · продвижение · как проходит оплата и что бывает,
     если не платят · путь от регистрации до тени и блокировки ·
     где мы отвечаем, а где нет · что видно в админке · подводные камни.</div>`;
  document.querySelectorAll('.nav a').forEach(a => a.classList.remove('on'));
}
function открыть(ключ){
  if(ЧАСТЬ === 'Ролик') return роликСтраница();
  const р = РАЗДЕЛЫ.find(x => x.ключ === ключ);
  if(!р) return пусто();
  if(р.часть !== ЧАСТЬ){ ЧАСТЬ = р.часть; строим(); }
  /* ⚠ ПОЛОСКА ДЕЙСТВИЙ НАД РАЗДЕЛОМ (19.08.2026): скачать этот раздел, скачать
     всю часть, пометить на удаление. Помеченный раздел показывается приглушённо
     и с подписью — чтобы человек видел, что уже отобрал. */
  const убран = УБРАТЬ.has(р.ключ);
  document.getElementById('page').innerHTML =
    `<div class="dlbar">
       <button onclick="скачатьРаздел('${р.ключ}')">Скачать раздел</button>
       <button onclick="скачатьЧасть('${р.часть}')">Скачать часть «${р.часть}»</button>
       <button class="${убран ? 'off' : ''}" onclick="пометить('${р.ключ}')">${
         убран ? 'Вернуть раздел' : 'Убрать раздел'}</button>
     </div>` +
    (убран ? `<div class="note warn"><b>Раздел помечен на удаление</b>
      Он останется на месте, пока вы не сохраните файл с пометками и не пришлёте его мне.</div>` : '') +
    `<div class="${убран ? 'убран' : ''}">` + р.html + `</div>` +
    `<div class="foot">My Home · ${р.часть.toLowerCase()} · документы живут вместе
     с прототипом: меняется приложение — меняется и этот файл</div>`;
  document.querySelectorAll('.nav a').forEach(a =>
    a.classList.toggle('on', a.dataset.k === р.ключ));
  /* ⚠ АДРЕС РАЗДЕЛА — ПОД ЗАЩИТОЙ (19.08.2026, находка Эдуарда: ошибка
     SecurityError в окне предпросмотра).
     Файл пишет ключ раздела в строку браузера, чтобы можно было вернуться по
     ссылке. Но в ОКНЕ ПРЕДПРОСМОТРА (about:srcdoc) браузер это запрещает —
     страница живёт в чужом окне и своей истории не имеет.
     Ошибка была безвредной: раздел открывался, ломалась только ссылка. Но она
     всплывала красным и пугала. Теперь просто молчим. */
  try { history.replaceState(null, '', '#' + р.ключ); } catch(e){}
  window.scrollTo(0, 0);
  document.title = р.имя + ' · ' + р.часть + ' · My Home';
}
document.addEventListener('keydown', e => {
  const свои = РАЗДЕЛЫ.filter(x => x.часть === ЧАСТЬ);
  const i = свои.findIndex(x => x.ключ === location.hash.slice(1));
  if(e.code === 'ArrowRight' && i >= 0 && i < свои.length - 1) открыть(свои[i+1].ключ);
  if(e.code === 'ArrowLeft'  && i > 0) открыть(свои[i-1].ключ);
});
строим();
/* ⚠ открываем ЗАПИСКУ, а не первый по порядку раздел (19.08.2026): она объявлена
   позже барахолки, но человек должен видеть её первой. */
открыть(location.hash.slice(1) || 'нач_первым');
